                  var container = document.getElementById('mynetwork');

                  edges = new vis.DataSet([{"from": "Lisinopril", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 231", "to": "Metformin", "value": 231}, {"from": "Lisinopril", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 228", "to": "Sertraline", "value": 228}, {"from": "Metformin", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 227", "to": "Albuterol", "value": 227}, {"from": "Albuterol", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 225", "to": "Sertraline", "value": 225}, {"from": "Metformin", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 222", "to": "Sertraline", "value": 222}, {"from": "Ibuprofen", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 220", "to": "Sertraline", "value": 220}, {"from": "Lisinopril", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 217", "to": "Albuterol", "value": 217}, {"from": "Metformin", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 202", "to": "Ibuprofen", "value": 202}, {"from": "Albuterol", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 201", "to": "Ibuprofen", "value": 201}, {"from": "Lisinopril", "title": "\u5171\u540c\u5f00\u5177\u6b21\u6570: 196", "to": "Ibuprofen", "value": 196}]);

};
